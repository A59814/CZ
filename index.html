<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>AutoDz Pro | سوق السيارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Tifinagh&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-hover:#F1F5F9; --surface-glass:rgba(255,255,255,0.85);
  --text:#1E293B; --muted:#64748B; --border:#E2E8F0;
  --primary:#2563EB; --primary-hover:#1D4ED8;
  --accent:#F97316; --danger:#EF4444; --ok:#10B981; --vip:#EAB308; --verified:#3B82F6;
  --r:16px; --shadow:0 4px 20px rgba(15,23,42,.05); --shadow-lg:0 10px 30px rgba(15,23,42,.1);
  --transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
[data-theme="dark"]{
  --bg:#0B1121; --surface:#151E31; --surface-hover:#1E2A45; --surface-glass:rgba(21,30,49,0.85);
  --text:#F1F5F9; --muted:#94A3B8; --border:#2D3A54;
  --primary:#3B82F6; --primary-hover:#2563EB; --shadow:0 4px 20px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-behavior:smooth}
html[lang="ar"] body{font-family:'Cairo',sans-serif}
html[lang="zgh"] body{font-family:'Noto Sans Tifinagh','Inter',sans-serif}
html[lang="fr"] body,html[lang="en"] body{font-family:'Inter',sans-serif}
html[lang="zh"] body{font-family:'Noto Sans SC',sans-serif}

body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background 0.3s, color 0.3s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;transition:var(--transition)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* Header */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface-glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--primary);cursor:pointer}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#60A5FA);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.search{flex:1;min-width:200px;position:relative;order:3}
.search input{width:100%;padding:12px 42px 12px 16px;border-radius:50px;border:1px solid var(--border);background:var(--surface);outline:none;transition:var(--transition);font-size:14px;box-shadow:var(--shadow);color:var(--text)}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.search-ico{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:16px}
.nav{display:flex;align-items:center;gap:8px;order:2;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--surface);box-shadow:var(--shadow);position:relative;font-size:18px}
.icon-btn:hover{background:var(--surface-hover)}
.icon-btn.active{color:#fff;background:var(--primary)}
.badge-count{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.lang-select{padding:8px 12px;border-radius:50px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--text);cursor:pointer;outline:none;box-shadow:var(--shadow)}
.btn-add{padding:10px 18px;border-radius:50px;font-weight:800;font-size:14px;background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(249,115,22,.3);display:flex;align-items:center;gap:6px}
.btn-add:hover{transform:translateY(-2px)}

/* Layout & Filters */
.container{max-width:1200px;margin:0 auto;padding:20px 20px 120px}
.filters-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;scrollbar-width:none}
.filters-scroll::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:50px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.vip-chip{background:linear-gradient(135deg,#FEF08A,#EAB308);color:#422006;border:none}

/* Grid & Cards */
.results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.count{color:var(--muted);font-size:14px;font-weight:600}
.sort-select{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;outline:none;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}

.card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;position:relative;display:flex;flex-direction:column;transition:var(--transition)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border)}
.card.vip-card{border:2px solid var(--vip);box-shadow:0 4px 20px rgba(234,179,8,0.15)}
.card-img{position:relative;aspect-ratio:4/3;background:var(--surface-hover);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .card-img img{transform:scale(1.05)}
.price-tag{position:absolute;bottom:12px;inset-inline-end:12px;background:var(--surface);color:var(--primary);padding:6px 12px;border-radius:10px;font-weight:900;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.badge-new{background:var(--accent);color:#fff}
.badge-vip{background:linear-gradient(135deg,#FDE047,#EAB308);color:#422006}
.badge-urgent{background:var(--danger);color:#fff}
.badge-verified{background:var(--verified);color:#fff}
.sold-overlay{position:absolute;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:2}
.sold-text{background:var(--danger);color:#fff;font-size:22px;font-weight:900;padding:8px 24px;border-radius:8px;transform:rotate(-10deg)}
.card-body{padding:16px;display:flex;flex-direction:column;flex:1}
.card-body h3{font-size:17px;font-weight:800;margin-bottom:4px}
.meta{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta-icons{display:flex;gap:8px;margin-bottom:12px}
.meta-icon{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;background:var(--surface-hover);padding:4px 8px;border-radius:6px}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);margin-top:auto}
.fav-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.fav-btn.on{color:var(--danger)}
.compare-checkbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);display:grid;place-items:center;cursor:pointer;transition:.2s;color:transparent}
.compare-checkbox.checked{background:var(--primary);border-color:var(--primary);color:#fff}

/* Bottom Sheets & Modals */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:.3s}
.overlay.open{opacity:1;pointer-events:auto}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:24px 24px 0 0;z-index:100;padding:20px 20px 30px;transform:translateY(100%);transition:var(--transition);box-shadow:0 -10px 40px rgba(0,0,0,.1);max-height:85vh;overflow-y:auto}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sheet-head h3{font-size:19px;font-weight:800}
.filter-group{margin-bottom:16px}
.filter-group label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.filter-group select,.filter-group input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;outline:none;color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkboxes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chk-label{display:flex;align-items:center;gap:6px;background:var(--surface-hover);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.chk-label input{accent-color:var(--primary);width:16px;height:16px}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn-outline{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);font-weight:800;font-size:14px;background:var(--surface);color:var(--text)}
.btn-solid{flex:2;padding:12px;border-radius:10px;background:var(--primary);color:#fff;font-weight:800;font-size:14px}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal.open{display:flex}
.modal-card{background:var(--surface);border-radius:20px;width:100%;max-width:800px;margin:auto;position:relative;box-shadow:var(--shadow-lg);animation:pop .3s ease}
.modal-card.sm{max-width:400px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:12px;inset-inline-end:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.1);color:var(--text);display:grid;place-items:center;font-size:18px;z-index:10}
[data-theme="dark"] .modal-close{background:rgba(255,255,255,.1)}

/* Detail */
.gallery{position:relative;aspect-ratio:16/9;background:var(--surface-hover);border-radius:20px 20px 0 0;overflow:hidden}
.gallery-main{width:100%;height:100%;object-fit:cover}
.gallery-thumbs{position:absolute;bottom:12px;inset-inline:0;display:flex;gap:6px;justify-content:center;padding:0 12px;overflow-x:auto}
.gallery-thumb{width:50px;height:38px;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.7}
.gallery-thumb.active{border-color:var(--primary);opacity:1}
.gallery-thumb img{width:100%;height:100%;object-fit:cover}
.detail-body{padding:24px}
.detail-title{font-size:24px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.detail-price{font-size:28px;font-weight:900;color:var(--primary);margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px}
.spec{background:var(--bg);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--border)}
.spec span{font-size:12px;color:var(--muted);font-weight:700}
.spec b{display:block;font-size:15px;margin-top:2px;font-weight:800}
.desc-box{background:var(--bg);border-radius:12px;padding:16px;font-size:14px;line-height:1.8;margin-bottom:20px;border:1px solid var(--border)}
.seller-box{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:16px;border:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;gap:12px}
.seller-info{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#60A5FA);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.contact-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-contact{flex:1;min-width:130px;padding:14px;border-radius:12px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-phone{background:var(--primary);color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-icon{flex:0;min-width:auto;padding:14px 18px;background:var(--surface-hover);color:var(--text)}
.btn-icon.danger{color:var(--danger);background:rgba(239,68,68,.1)}

/* Reviews */
.reviews-section{margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
.review-item{background:var(--bg);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid var(--border)}
.review-header{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;font-weight:700}
.stars{color:var(--vip);letter-spacing:2px}

/* Compare */
.compare-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:80;box-shadow:0 -4px 20px rgba(0,0,0,.1);transform:translateY(100%);transition:var(--transition)}
.compare-bar.show{transform:translateY(0)}
.compare-thumbs{display:flex;gap:8px}
.compare-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:2px solid var(--primary)}
.btn-compare{background:var(--primary);color:#fff;padding:10px 20px;border-radius:10px;font-weight:800;font-size:14px}
.compare-table{width:100%;border-collapse:collapse;margin-top:16px}
.compare-table th,.compare-table td{padding:12px;border-bottom:1px solid var(--border);text-align:center;font-size:14px}
.compare-table th{background:var(--surface-hover);font-weight:800}
.compare-table img{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:8px}

/* Add Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:14px;outline:none;color:var(--text)}
.field textarea{resize:vertical;min-height:80px}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:8px}
.photo-tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.photo-tile img{width:100%;height:100%;object-fit:cover}
.photo-remove{position:absolute;top:2px;inset-inline-end:2px;width:18px;height:18px;border-radius:50%;background:rgba(239,68,68,.9);color:#fff;display:grid;place-items:center;font-size:10px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.photo-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:8px;background:var(--surface-hover);border:1px dashed var(--border);font-size:13px;font-weight:700;color:var(--muted)}
.form-actions{display:flex;gap:10px;padding:0 20px 20px}

/* Empty & Toast */
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty-ico{font-size:56px;margin-bottom:12px;opacity:.4}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--surface);padding:12px 24px;border-radius:50px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);z-index:300;transition:var(--transition);opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

#shareCanvas{display:none}

@media(max-width:768px){
  .form-grid{grid-template-columns:1fr}
  .brand-name{display:none}
  .topbar-inner{padding:10px 16px;gap:8px}
  .search{order:10;flex-basis:100%;margin-top:4px}
  .nav{flex:1;justify-content:flex-end}
  .compare-bar{padding:10px 16px}
  .compare-thumb{width:32px;height:32px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="window.scrollTo(0,0)">
      <div class="brand-logo">🇩🇿</div>
      <span class="brand-name">AutoDz</span>
    </div>
    
    <div class="search">
      <input id="searchInput" type="search" placeholder="ابحث...">
      <span class="search-ico">🔍</span>
    </div>

    <nav class="nav">
      <select id="langSelect" class="lang-select">
        <option value="ar">العربية</option>
        <option value="zgh">ⵜⴰⵎⴰⵣⵉⵖⵜ</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>

      <button class="icon-btn" id="themeToggle" title="Dark Mode">🌙</button>
      <button class="icon-btn" id="navProfile" title="My Account">👤</button>
      <button class="icon-btn active" id="navBrowse" title="Browse">🏠</button>
      <button class="icon-btn" id="navFav" style="position:relative" title="Favorites">
        ❤️<span class="badge-count" id="favCount" style="display:none">0</span>
      </button>
      <button class="btn-add" id="btnAdd">+ <span data-i18n="addListing">إعلان</span></button>
    </nav>
  </div>
</header>

<div class="container">
  <div class="filters-scroll" id="quickFilters">
    <button class="chip active" data-filter="all" data-i18n="all">الكل</button>
    <button class="chip vip-chip" data-filter="vip">👑 VIP</button>
    <button class="chip" data-filter="urgent" data-i18n="urgent">⏳ مستعجل</button>
    <button class="chip" data-filter="exchange" data-i18n="exchange">🔄 تبادل</button>
    <button class="chip" data-filter="verified" data-i18n="verified">✅ موثق</button>
    <button class="chip" data-filter="brand:Renault">Renault</button>
    <button class="chip" data-filter="brand:Peugeot">Peugeot</button>
    <button class="chip" id="btnOpenFilters">⚙️ <span data-i18n="filters">الفلاتر</span></button>
  </div>

  <div class="results-head">
    <div class="count"><span data-i18n="showing">عرض</span> <b id="resCount">0</b> <span data-i18n="car">سيارة</span></div>
    <select id="sortSel" class="sort-select">
      <option value="new" data-i18n="sortNew">الأحدث</option>
      <option value="cheap" data-i18n="sortCheap">الأرخص</option>
      <option value="expensive" data-i18n="sortExpensive">الأغلى</option>
      <option value="km" data-i18n="sortKm">الأقل كم</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Compare Bar -->
<div class="compare-bar" id="compareBar">
  <div class="compare-thumbs" id="compareThumbs"></div>
  <div style="display:flex;gap:8px">
    <button class="btn-outline" onclick="clearCompare()">✕</button>
    <button class="btn-compare" onclick="openCompareModal()">مقارنة 🆚</button>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal" id="authModal">
  <div class="modal-card sm">
    <button class="modal-close" id="closeAuth">✕</button>
    <div style="padding: 24px 24px 0;">
      <h2 style="font-size:22px; font-weight:900; margin-bottom:16px;" data-i18n="authTitle">مرحباً بك</h2>
      <div class="auth-tabs" style="display:flex;margin-bottom:20px;border-bottom:1px solid var(--border)">
        <div class="auth-tab active" id="tabLogin" data-i18n="login" style="flex:1;text-align:center;padding:12px;font-weight:800;cursor:pointer;border-bottom:3px solid var(--primary);color:var(--primary)">تسجيل الدخول</div>
        <div class="auth-tab" id="tabRegister" data-i18n="register" style="flex:1;text-align:center;padding:12px;font-weight:800;cursor:pointer;color:var(--muted)">حساب جديد</div>
      </div>
    </div>
    <div style="padding:0 24px 24px">
      <form id="authForm" style="display:flex;flex-direction:column;gap:12px">
        <div id="nameGroup" style="display:none;">
          <input type="text" id="authName" placeholder="الاسم الكامل" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
        </div>
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني" required style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)">

            <label class="chk-label"><input type="checkbox" name="urgent"> بيع مستعجل</label>

<canvas id="shareCanvas" width="800" height="800"></canvas>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ═══════════ 1) State & Local Storage ═══════════ */
const CARS_KEY = 'dz_cars_v3';
const FAV_KEY = 'dz_favs_v3';
const USERS_KEY = 'dz_users_v3';
const CURRENT_USER_KEY = 'dz_current_user_v3';
const THEME_KEY = 'dz_theme_v3';

let cars = [], users = [], favs = new Set(), compareList = new Set(), currentUser = null;
let state = { view: 'browse', q: '', brand: '', city: '', fuel: '', gear: '', yearMin: '', priceMin: '', priceMax: '', sort: 'new', verified: false, urgent: false, exchange: false, papers: false, vip: false };

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function safeParse(k, fallback) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}

function initData() {
  cars = safeParse(CARS_KEY, []);
  favs = new Set(safeParse(FAV_KEY, []));
  users = safeParse(USERS_KEY, []);
  currentUser = safeParse(CURRENT_USER_KEY, null);
  if (currentUser) $('#navProfile').classList.add('active');

  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    $('#themeToggle').textContent = '☀️';
  }
}
function saveCars() { localStorage.setItem(CARS_KEY, JSON.stringify(cars)); }
function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }
function saveUsers() { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function saveCurrentUser() { localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser)); }

/* ═══════════ 2) Helpers ═══════════ */
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtPrice = n => n.toLocaleString('en-US') + ' دج';
const I18N = { soldLabel: 'مباع', urgent: 'مستعجل', verified: 'موثق', sellerPrivate: 'بائع' };
const t = k => I18N[k] || k;

function toast(msg, type='') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._tm);
  el._tm = setTimeout(()=> el.className = 'toast ' + type, 3000);
}
function svgPlaceholder(brand, model) {
  const hues = [[210,80,60],[150,60,50],[30,90,60],[260,60,60],[190,70,50]];
  const hash = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; };
  const h = hues[hash(brand + model) % hues.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(${h[0]},${h[1]}%,${h[2]}%)"/>
      <stop offset="1" stop-color="hsl(${h[0]+20},${h[1]}%,${h[2]-15}%)"/>
    </linearGradient></defs>
    <rect width="400" height="300" fill="url(#g)"/>
    <circle cx="330" cy="60" r="80" fill="rgba(255,255,255,.1)"/>
    <circle cx="70" cy="260" r="60" fill="rgba(255,255,255,.1)"/>
    <g transform="translate(96,120)">
      <path fill="rgba(255,255,255,.95)" d="M18 52h164a10 10 0 0 0 10-10v-9a16 16 0 0 0-12-15.5l-24-6a70 70 0 0 0-22-4h-40a70 70 0 0 0-22 4l-24 6A16 16 0 0 0 8 33v9a10 10 0 0 0 10 10z"/>
      <circle cx="52" cy="58" r="14" fill="rgba(15,23,42,.8)"/>
      <circle cx="148" cy="58" r="14" fill="rgba(15,23,42,.8)"/>
    </g>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ═══════════ 3) UI Logic ═══════════ */
function toggleCompare(id) {
  if (compareList.has(id)) compareList.delete(id);
  else {
    if (compareList.size >= 3) { toast('يمكنك مقارنة 3 سيارات كحد أقصى', 'err'); return; }
    compareList.add(id);
  }
  render();
  updateCompareBar();
}

function updateCompareBar() {
  const bar = $('#compareBar');
  const thumbs = $('#compareThumbs');
  if (compareList.size > 0) {
    bar.classList.add('show');
    thumbs.innerHTML = [...compareList].map(id => {
      const c = cars.find(x => x.id === id);
      if (!c) return '';
      return `<img class="compare-thumb" src="${(c.images && c.images[0]) || svgPlaceholder(c.brand, c.model)}">`;
    }).join('');
  } else {
    bar.classList.remove('show');
  }
}

function clearCompare() {
  compareList.clear();
  updateCompareBar();
  render();
}

function openCompareModal() {
  const compareCars = [...compareList].map(id => cars.find(c => c.id === id)).filter(Boolean);
  if (compareCars.length < 2) { toast('اختر سيارتين على الأقل', 'err'); return; }
  
  let html = `<tr><th>الخاصية</th>${compareCars.map(c => `<th>${esc(c.brand)} ${esc(c.model)}</th>`).join('')}</tr>`;
  html += `<tr><td>الصورة</td>${compareCars.map(c => `<td><img src="${(c.images && c.images[0]) || svgPlaceholder(c.brand, c.model)}"></td>`).join('')}</tr>`;
  html += `<tr><td>السعر</td>${compareCars.map(c => `<td style="color:var(--primary);font-weight:900">${fmtPrice(c.price)}</td>`).join('')}</tr>`;
  html += `<tr><td>السنة</td>${compareCars.map(c => `<td>${c.year}</td>`).join('')}</tr>`;
  html += `<tr><td>الكيلومترات</td>${compareCars.map(c => `<td>${c.km.toLocaleString()} كم</td>`).join('')}</tr>`;
  html += `<tr><td>الوقود</td>${compareCars.map(c => `<td>${esc(c.fuel)}</td>`).join('')}</tr>`;
  html += `<tr><td>الولاية</td>${compareCars.map(c => `<td>${esc(c.city)}</td>`).join('')}</tr>`;
  
  $('#compareTable').innerHTML = html;
  $('#compareModal').classList.add('open');
}

function updateBadges(c) {
  const badges = [];
  if (c.status === 'sold') badges.push(`<span class="badge badge-urgent">${t('soldLabel')}</span>`);
  if (c.isVip) badges.push(`<span class="badge badge-vip">👑 VIP</span>`);
  if (c.isUrgent) badges.push(`<span class="badge badge-urgent">⏳ ${t('urgent')}</span>`);
  if (c.isVerified) badges.push(`<span class="badge badge-verified">✅ ${t('verified')}</span>`);
  return badges.join('');
}

/* ═══════════ 4) Render ═══════════ */
function getFilteredCars() {
  let list = [...cars];
  
  if (state.view === 'fav') list = list.filter(c => favs.has(c.id));
  else if (state.view === 'myListings') list = currentUser ? list.filter(c => c.ownerEmail === currentUser.email) : [];
  else list = list.filter(c => c.status !== 'sold');

  if(state.brand) list = list.filter(c => c.brand === state.brand);
  if(state.city) list = list.filter(c => c.city === state.city);
  if(state.verified) list = list.filter(c => c.isVerified);
  if(state.urgent) list = list.filter(c => c.isUrgent);
  if(state.exchange) list = list.filter(c => c.isExchange);
  if(state.papers) list = list.filter(c => c.hasPapers);
  if(state.vip) list = list.filter(c => c.isVip);
  if(state.priceMin !== '' && state.priceMin != null) list = list.filter(c => c.price >= +state.priceMin);
  if(state.priceMax !== '' && state.priceMax != null) list = list.filter(c => c.price <= +state.priceMax);
  
  if(state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(c => `${c.brand} ${c.model} ${c.city} ${c.year} ${c.name}`.toLowerCase().includes(q));
  }

  if(state.sort === 'new') list.sort((a,b) => b.createdAt - a.createdAt);
  else if(state.sort === 'cheap') list.sort((a,b) => a.price - b.price);
  else if(state.sort === 'expensive') list.sort((a,b) => b.price - a.price);
  else if(state.sort === 'km') list.sort((a,b) => a.km - b.km);

  // VIP first
  return list.sort((a,b) => (b.isVip ? 1 : 0) - (a.isVip ? 1 : 0));
}

function render() {
  const list = getFilteredCars();
  $('#resCount').textContent = list.length;
  $('#favCount').textContent = favs.size;
  $('#favCount').style.display = favs.size ? 'grid' : 'none';

  const grid = $('#grid');
  if(list.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-ico">🚗</div><b>لا توجد سيارات</b><div>جرّب تغيير الفلاتر أو أضف سيارتك الأولى</div></div>`;
    return;
  }

  grid.innerHTML = list.map(c => {
    const img = (c.images && c.images[0]) || svgPlaceholder(c.brand, c.model);
    const isFav = favs.has(c.id);
    const inCompare = compareList.has(c.id);
    
    return `<article class="card ${c.isVip ? 'vip-card' : ''}" data-id="${c.id}">
      <div class="card-img">
        <img src="${img}" alt="${esc(c.brand)}" loading="lazy">
        <div class="badges">${updateBadges(c)}</div>
        <span class="price-tag">${fmtPrice(c.price)}</span>
      </div>
      <div class="card-body">
        <h3>${esc(c.brand)} ${esc(c.model)}</h3>
        <div class="meta">
          <span>${c.year}</span> · <span>${c.km.toLocaleString()} كم</span>
        </div>
        <div class="meta-icons">
          ${c.isExchange ? '<span class="meta-icon">🔄 تبادل</span>' : ''}
          ${c.hasPapers ? '<span class="meta-icon">📄 وثائق</span>' : ''}
          ${c.isUrgent ? '<span class="meta-icon" style="color:var(--danger)">⏳ مستعجل</span>' : ''}
        </div>
        <div class="card-foot">
          <div style="display:flex;gap:8px;align-items:center">
            <button class="fav-btn ${isFav?'on':''}" data-fav="${c.id}">${isFav?'❤️':'🤍'}</button>
            <div class="compare-checkbox ${inCompare?'checked':''}" data-compare="${c.id}">✓</div>
          </div>
          <span style="font-size:12px;color:var(--muted)">📍 ${esc(c.city)}</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ═══════════ 5) Interactions ═══════════ */
$('#themeToggle').onclick = () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  $('#themeToggle').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark');
};

$('#searchInput').oninput = e => { state.q = e.target.value.trim(); render(); };
$('#sortSel').onchange = e => { state.sort = e.target.value; render(); };

$('#grid').onclick = e => {
  const fav = e.target.closest('[data-fav]');
  if(fav) { e.stopPropagation(); const id = fav.dataset.fav; if(favs.has(id)) favs.delete(id); else favs.add(id); saveFavs(); render(); return; }
  
  const cmp = e.target.closest('[data-compare]');
  if(cmp) { e.stopPropagation(); toggleCompare(cmp.dataset.compare); return; }
  
  const card = e.target.closest('.card');
  if(card) openDetail(card.dataset.id);
};

$$('.chip[data-filter]').forEach(chip => {
  chip.onclick = () => {
    const f = chip.dataset.filter;
    $$('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    
    state.brand = ''; state.verified = false; state.urgent = false; state.exchange = false; state.vip = false;
    
    if(f === 'vip') state.vip = true;
    else if(f === 'urgent') state.urgent = true;
    else if(f === 'exchange') state.exchange = true;
    else if(f === 'verified') state.verified = true;
    else if(f.startsWith('brand:')) state.brand = f.split(':')[1];
    
    render();
  };
});

const toggleSheet = (open) => {
  $('#bottomSheet').classList.toggle('open', open);
  $('#sheetOverlay').classList.toggle('open', open);
};
$('#btnOpenFilters').onclick = () => toggleSheet(true);
$('#btnCloseFilters').onclick = () => toggleSheet(false);
$('#sheetOverlay').onclick = () => toggleSheet(false);

$('#applyFilters').onclick = () => {
  state.verified = $('#fVerified').checked;
  state.urgent = $('#fUrgent').checked;
  state.exchange = $('#fExchange').checked;
  state.papers = $('#fPapers').checked;
  state.brand = $('#fBrand').value;
  state.city = $('#fCity').value;
  state.priceMin = $('#fPriceMin').value;
  state.priceMax = $('#fPriceMax').value;
  toggleSheet(false);
  render();
};

$('#resetFilters').onclick = () => {
  $('#fVerified').checked = false; $('#fUrgent').checked = false; $('#fExchange').checked = false; $('#fPapers').checked = false;
  $('#fBrand').value = ''; $('#fCity').value = ''; $('#fPriceMin').value = ''; $('#fPriceMax').value = '';
  state = { ...state, verified: false, urgent: false, exchange: false, papers: false, brand: '', city: '', priceMin: '', priceMax: '' };
  toggleSheet(false);
  render();
};

/* ═══════════ 6) Detail Modal & Share Image ═══════════ */
let currentCar = null;
let currentImgIdx = 0;

function openDetail(id) {
  currentCar = cars.find(c => c.id === id);
  if(!currentCar) return;
  
  if(!currentUser || currentUser.email !== currentCar.ownerEmail) {
    currentCar.views = (currentCar.views || 0) + 1;
    saveCars();
  }
  currentImgIdx = 0;
  renderDetail();
  $('#detailModal').classList.add('open');
}

function renderDetail() {
  const c = currentCar;
  const imgs = (c.images && c.images.length) ? c.images : [svgPlaceholder(c.brand, c.model)];
  const isOwner = currentUser && currentUser.email === c.ownerEmail;
  const isSold = c.status === 'sold';
  const waLink = 'https://wa.me/213' + c.phone.replace(/^0/, '');
  
  const reviews = c.reviews || [
    { user: 'Ahmed', stars: 5, text: 'بائع محترم والسيارة كما في الوصف.' },
    { user: 'Karim', stars: 4, text: 'التواصل كان ممتاز.' }
  ];

  $('#detailCard').innerHTML = `
    <button class="modal-close" id="closeDetail">✕</button>
    <div class="gallery">
      <img class="gallery-main" src="${imgs[currentImgIdx]}">
      ${imgs.length > 1 ? `<div class="gallery-thumbs">${imgs.map((im,i) => `<div class="gallery-thumb ${i===currentImgIdx?'active':''}" onclick="currentImgIdx=${i};renderDetail()"><img src="${im}"></div>`).join('')}</div>` : ''}
    </div>
    <div class="detail-body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="detail-title">
            ${esc(c.brand)} ${esc(c.model)}
            ${c.isVerified ? '<span title="Verified" style="color:var(--verified);font-size:18px">✅</span>' : ''}
          </div>
          <div class="detail-sub">${c.year} · ${c.km.toLocaleString()} كم · ${esc(c.city)} · ${c.views || 0} مشاهدة</div>
        </div>
      </div>
      
      <div class="detail-price">
        ${fmtPrice(c.price)}
        ${c.negotiable ? '<span style="font-size:14px;color:var(--accent)">(قابل للتفاوض)</span>' : ''}
      </div>
      
      <div class="specs">
        <div class="spec"><span>السنة</span><b>${c.year}</b></div>
        <div class="spec"><span>الوقود</span><b>${esc(c.fuel)}</b></div>
        <div class="spec"><span>ناقل الحركة</span><b>${esc(c.gear)}</b></div>

function generateShareImage(c) {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, 800, 800);
  
  ctx.fillStyle = '#2563EB';
  ctx.fillRect(0, 0, 800, 120);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 40px Cairo, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('AutoDz 🇩🇿', 400, 75);
  
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = (c.images && c.images[0]) || svgPlaceholder(c.brand, c.model);
  img.onload = () => {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 120, 800, 450); ctx.clip();
    const w = img.width || 400, h = img.height || 300;
    const scale = Math.max(800 / w, 450 / h);
    const x = (800 - w * scale) / 2;
    const y = 120 + (450 - h * scale) / 2;
    ctx.drawImage(img, x, y, w * scale, h * scale);
    ctx.restore();
    
    ctx.fillStyle = '#1E293B';
    ctx.font = 'bold 48px Cairo, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${c.brand} ${c.model}`, 400, 640);
    
    ctx.fillStyle = '#2563EB';
    ctx.font = 'bold 60px Cairo, sans-serif';
    ctx.fillText(`${c.price.toLocaleString()} دج`, 400, 720);
    
    ctx.fillStyle = '#64748B';
    ctx.font = 'bold 30px Cairo, sans-serif';
    ctx.fillText(`${c.year} | ${c.km.toLocaleString()} كم | ${c.city}`, 400, 770);
    
    const link = document.createElement('a');
    link.download = `${c.brand}_${c.model}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('تم تحميل الصورة!', 'ok');
  };
}

async function handleFiles(files) {
  for(let f of files) {
    if(pendingPhotos.length >= 5) break;
    if(!f.type.startsWith('image/')) continue;
    const b64 = await compressImage(f);
    pendingPhotos.push(b64);
  }
  renderPhotos();
}

function compressImage(file, maxW = 800, q = 0.75) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const cv = document.createElement('canvas');
        cv.width = img.width * scale; cv.height = img.height * scale;
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', q));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    fuel: fd.get('fuel'), gear: fd.get('gear'), city: fd.get('city'),
    name: fd.get('name').trim(), phone, desc: fd.get('desc').trim(),
    negotiable: fd.get('negotiable') === 'on',
    isExchange: fd.get('exchange') === 'on',
    isUrgent: fd.get('urgent') === 'on',
    hasPapers: fd.get('papers') === 'on',
    isVerified: false, isVip: false, status: 'available', views: 0, createdAt: Date.now(),
    images: pendingPhotos
  };

  cars.unshift(newCar);
